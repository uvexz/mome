name: CI

on:
  push:
  pull_request:

# 同一 commit 的 push 与 pull_request 只跑最新一次
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:/tmp/mome-ci.db
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      # 固定到 commit：tag 可被移动，CI 结果才可复现
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - run: bun run build
      # 每次运行生成随机 secret，杜绝"把 CI 硬编码示例密钥复制到生产"的隐患
      - run: |
          printf 'DATABASE_URL=%s\nBETTER_AUTH_URL=%s\nBETTER_AUTH_SECRET=%s\n' \
            "$DATABASE_URL" "$BETTER_AUTH_URL" "$(openssl rand -hex 32)" > .env.local
      - run: bun run db:migrate
